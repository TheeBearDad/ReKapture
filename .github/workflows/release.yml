# Builds and publishes a release when a version tag (v1.2.3) is pushed.
# The tag must match appVersion in app_windows.go and winres/winres.json.
# Release notes come from notes/<tag>.md when that file exists.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis zip
          go install github.com/tc-hib/go-winres@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: go test -count=1 -run 'Classify|GameTracker|DiscordRoot|EffectiveDiscord|AudioTrackLayout|NormalizeGames|NewerVersion|ParseSums|Updater|AllowedDownload|ApplyPortable|PortableData|ArgsAreValid' .

      - name: Download FFmpeg (Windows, LGPL)
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          unzip -q ffmpeg.zip -d ffmpeg-dl

      - name: Build installer and portable zip
        env:
          MAKENSIS_FLAGS: -V2
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" ffmpeg-dl/ffmpeg-master-latest-win64-lgpl

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ -f "notes/$GITHUB_REF_NAME.md" ]; then NOTES=(--notes-file "notes/$GITHUB_REF_NAME.md"); else NOTES=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/"$V"/* --verify-tag --title "ReKapture $V" "${NOTES[@]}"
